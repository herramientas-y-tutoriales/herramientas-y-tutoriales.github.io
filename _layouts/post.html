---
layout: default
---
<article class="transmission"><div class="transmission-head"><p>TRANSMISION <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d.%m.%Y" }}</time></p><a class="source-cassette" href="{{ site.repository_url }}/blob/{{ site.branch }}/{{ page.path }}" target="_blank" rel="noopener">MD<br>SOURCE</a></div><h1>{{ page.title }}</h1>{% if page.description %}<p class="lede">{{ page.description }}</p>{% endif %}{% if page.image %}<figure class="cover"><img src="{{ page.image | relative_url }}" alt="{{ page.title }}"><figcaption>SEÑAL VISUAL</figcaption></figure>{% endif %}<div class="prose">{{ content }}</div></article>
